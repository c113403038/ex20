<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 50px;
            background-color: #f0f0f0;
        }

        .container {
            background: white;
            padding: 30px;
            border: 1px solid #ccc;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
            display: inline-block;
            position: relative; 
            min-width: 550px;
            min-height: 200px;
            vertical-align: top;
        }
        table {
            border-collapse: collapse;
            width: 250px;
            display: inline-table;
        }

        table, th, td {
            border: 1px solid #000;
        }

        th, td {
            padding: 8px 12px;
            text-align: left;
            font-family: "Times New Roman", Times, serif;
            font-weight: bold; 
            font-size: 18px;
        }

        thead th {
            background-color: #666;
            color: white;
        }

        tbody tr:nth-child(odd) {
            background-color: #ffff00;
        }
        
        tbody tr:nth-child(even) {
            background-color: #ffffff;
        }
        .fixed-box {
            position: absolute; 
            top: 20px;
            right: 20px;
            
            width: fit-content; 
            
            border: 2px solid #76a02d;
            background-color: white;
            padding: 8px;
            font-family: "Times New Roman", Times, serif;
            font-size: 16px;
            line-height: 1.2;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="container">
        <table>
            <thead>
                <tr>
                    <th>Firstname</th>
                    <th>Lastname</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>1</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>2</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>3</td>
                </tr>
            </tbody>
        </table>

        <div class="fixed-box">
            This div<br>
            element has<br>
            position: fixed;
        </div>
    </div>

</body>
</html>
