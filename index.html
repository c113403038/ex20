<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 50px;
            background-color: #f8f8f8; 
        }

        .container {
            background: white;
            padding: 20px;
            border: 1px solid #ddd;
            display: inline-block;
            position: relative;
            min-width: 600px;
            min-height: 200px;
        }

        table {
            border-collapse: collapse;
            width: 250px;
        }

        table, th, td {
            border: 1px solid #000;
        }

        th, td {
            padding: 8px 12px;
            text-align: left;
            font-family: "Times New Roman", Times, serif;
            font-weight: bold; 
            font-size: 18px;
        }

        thead th {
            background-color: #666;
            color: white;
        }

        tbody tr:nth-child(odd) {
            background-color: #ffff00;
        }
        
        tbody tr:nth-child(even) {
            background-color: #ffffff;
        }

        
        .fixed-box {
            position: fixed;
            top: 70px;
            right: 150px; 
            width: 140px; 
            border: 3px solid #76a02d;
            background-color: white;
            padding: 5px 10px;
            font-family: "Times New Roman", Times, serif;
            font-size: 16px;
            line-height: 1.2;
        }
    </style>
</head>
<body>

    <div class="container">
        <table>
            <thead>
                <tr>
                    <th>Firstname</th>
                    <th>Lastname</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>1</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>2</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>3</td>
                </tr>
            </tbody>
        </table>

        <div class="fixed-box">
            This div<br>
            element has<br>
            position: fixed;
        </div>
    </div>

</body>
</html>
